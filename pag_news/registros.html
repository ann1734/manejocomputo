<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Mantenimiento</title>

<link rel="stylesheet" href="../diseño/regis.css">
</head>

<body>

<header>
    <h1>Sistema de Mantenimiento de Cómputo</h1>
</header>

<section>

    <h2 class="titulo">Registro de Cliente</h2>

    <div class="contenedor">
        <input type="text" id="nombre" placeholder="Nombre del Cliente">
        <input type="email" id="correo" placeholder="Correo Electrónico">
        <input type="text" id="whatsapp" placeholder="WhatsApp">
        <input type="text" id="Numero" placeholder="Número de Casa">
        <input type="text" id="Red" placeholder="Red Social">
        <input type="text" id="direccion" placeholder="Dirección completa">
        <input type="text" id="referencia" placeholder="Referencia o ubicación adicional">

        <button onclick="guardarContacto()">Guardar</button>
    </div>

<!--
    <h2 class="titulo">Lista de Clientes</h2>

    <div class="tabla-responsive">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>

</section>

    <footer>

        <div class="footer-info">

            <h2>Mantenimiento de Equipo de Cómputo</h2>

            <p>
                Soluciones tecnológicas para computadoras y laptops.
            </p>

        </div>

        <div class="footer-links">

            <a href="#">contacto.tecnoreset@gmail.com</a>
            <a href="#">+52 55 4832 9176</a>

        </div>

        <p class="copy">
            © 2026 Todos los derechos reservados.
        </p>

    </footer>

<script>
let contactos = [];

function guardarContacto() {

    let nombre = document.getElementById("nombre").value;
    let correo = document.getElementById("correo").value;
    let whatsapp = document.getElementById("whatsapp").value;
    let Numero = document.getElementById("Numero").value;
    let Red = document.getElementById("Red").value;
    let direccion = document.getElementById("direccion").value;
    let referencia = document.getElementById("referencia").value;

    contactos.push({
        nombre,
        correo,
        whatsapp,
        Numero,
        Red,
        direccion,
        referencia
    });

    mostrarContactos();

    document.querySelectorAll("input").forEach(input => {
        input.value = "";
    });
}

function mostrarContactos() {

    let tabla = document.getElementById("tablaContactos");

    tabla.innerHTML = "";

    contactos.forEach(c => {

        tabla.innerHTML += `
        <tr>
            <td>${c.nombre}</td>
            <td>${c.correo}</td>
            <td>${c.whatsapp}</td>
            <td>${c.Numero}</td>
            <td>${c.Red}</td>
            <td>${c.direccion}</td>
            <td>${c.referencia || "Sin referencia"}</td>
        </tr>
        `;
    });
}
</script>

</body>
</html>
